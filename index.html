<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Grid Game Mobile</title>
<style>
  html,body{margin:0;height:100%;background:#eee;font-family:system-ui,Arial}
  #wrap{display:flex;flex-direction:column;height:100%}
  canvas{touch-action:none;display:block;margin:0 auto;background:#333;border:1px solid #999}
  #coords{text-align:center;margin-top:4px;font-size:14px}
  #seeds{text-align:center;margin-top:4px;font-size:14px}
  #seeds input{width:90px}
  .controls{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:20px;
            padding:12px;pointer-events:none;}
  .pad{pointer-events:auto;display:grid;grid-template-columns:48px 48px 48px;
       grid-template-rows:48px 48px 48px;gap:6px;opacity:.95;user-select:none;}
  .btn{background:#fff;border:1px solid #bbb;border-radius:12px;
       box-shadow:0 2px 6px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;
       font-size:16px;font-weight:600;touch-action:none;}
  .btn:active{transform:translateY(1px)}
  .up{grid-column:2;grid-row:1}
  .left{grid-column:1;grid-row:2}
  .right{grid-column:3;grid-row:2}
  .down{grid-column:2;grid-row:3}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="480"></canvas>
  <div id="coords"></div>
  <div id="seeds">
    <label>X:&nbsp;<input id="seedX" type="number"></label>
    <label>Y:&nbsp;<input id="seedY" type="number"></label>
  </div>
</div>
<div class="controls">
  <div class="pad">
    <div class="btn up"    data-dx="0"  data-dy="-1">▲</div>
    <div class="btn left"  data-dx="-1" data-dy="0">◀</div>
    <div class="btn right" data-dx="1"  data-dy="0">▶</div>
    <div class="btn down"  data-dx="0"  data-dy="1">▼</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const coordEl = document.getElementById('coords');

let CELL = 16;
function setZoom(newCell){
  CELL = Math.max(1, Math.min(64, newCell));
  render();
}
function zoom(factor){ setZoom(CELL * factor); }

let px = 0, py = 0; // позиция игрока в мире
let seedX = 73856093, seedY = 19349663; // множители генерации стен
let exploding = false; // взрыв в процессе
let defuseMode = false; // режим разминирования
const flagged = new Set(); // отмеченные мины

// посещённые области
const REVEAL_RADIUS = 0;
const revealed = new Set();
function revealAround(x, y){
  for(let dx=-REVEAL_RADIUS; dx<=REVEAL_RADIUS; dx++){
    for(let dy=-REVEAL_RADIUS; dy<=REVEAL_RADIUS; dy++){
      revealed.add((x+dx)+","+(y+dy));
    }
  }
}
revealAround(px, py);

// псевдослучайные стены
function isWall(x,y){
  if ((x===0 && y===0) || (Math.abs(x)+Math.abs(y)===1)) return false;
  const v = (x*seedX ^ y*seedY) >>> 0;
  return (v % 100) < 0; // ~15% стен
}

// псевдослучайные мины
function isMine(x,y){
  if ((x===0 && y===0) || (Math.abs(x)+Math.abs(y)===1)) return false;
  const v = (x*seedX ^ y*seedY ^ 0xdeadbeef) >>> 0;
  return (v % 100) < 25; // ~5% мин
}

function countAdjacentMines(x, y){
  let count = 0;
  for(let dx=-1; dx<=1; dx++){
    for(let dy=-1; dy<=1; dy++){
      if(dx===0 && dy===0) continue;
      const nx=x+dx, ny=y+dy;
      if(!isWall(nx,ny) && isMine(nx,ny)) count++;
    }
  }
  return count;
}

function moveBy(dx, dy){
  if (exploding) return;
  const nx = px + dx, ny = py + dy;
  if (isWall(nx, ny)) return;

  const ox = px, oy = py;
  px = nx; py = ny;
  revealAround(px, py);
  if (defuseMode){
    if (isMine(px, py)){
      flagged.add(nx+","+ny);
      px = ox; py = oy;
      revealAround(px, py);
    }else{
      px = 0; py = 0;
      revealAround(px, py);
    }
    defuseMode = false;
    render();
    return;
  }

  if (isMine(px, py)){
    exploding = true;
    render();
    drawExplosion();
    setTimeout(()=>{ px=0; py=0; revealAround(px,py); exploding=false; render(); }, 500);
  }else{
    render();
  }
}

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // вычисляем окно мира
  const VIEW_COLS = Math.floor(canvas.width / CELL);
  const VIEW_ROWS = Math.floor(canvas.height / CELL);
  const halfC = Math.floor(VIEW_COLS/2);
  const halfR = Math.floor(VIEW_ROWS/2);
  const tlx = px - halfC, tly = py - halfR;
  const brx = tlx + VIEW_COLS - 1, bry = tly + VIEW_ROWS - 1;

  ctx.font = `${CELL*0.8}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // видимые клетки
  for(let gy=tly; gy<=bry; gy++){
    for(let gx=tlx; gx<=brx; gx++){
      const key=gx+","+gy;
      if(!revealed.has(key)) continue;
      const sx=(gx-tlx)*CELL, sy=(gy-tly)*CELL;

      ctx.fillStyle='#555';
      ctx.fillRect(sx,sy,CELL,CELL);
      ctx.strokeStyle='#444';
      ctx.strokeRect(sx,sy,CELL,CELL);

      if (isWall(gx,gy)){
        ctx.fillStyle='#777';
        ctx.fillRect(sx+1,sy+1,CELL-2,CELL-2);
      }else if(isMine(gx,gy)){
        ctx.fillStyle='#f00';
        ctx.fillRect(sx+1,sy+1,CELL-2,CELL-2);
        if(flagged.has(key)){
          ctx.fillStyle='#fff';
          ctx.fillText('⚑', sx+CELL/2, sy+CELL/2);
        }
      }else{
        const mines=countAdjacentMines(gx,gy);
        if(mines>0){
          ctx.fillStyle='#000';
          ctx.fillText(mines, sx+CELL/2, sy+CELL/2);
        }
      }
    }
  }

  // игрок (в центре экрана)
  if(!exploding){
    const psx=(px-tlx)*CELL+1, psy=(py-tly)*CELL+1;
    ctx.fillStyle = defuseMode ? '#ff0' : '#3572ff';
    ctx.fillRect(psx,psy,CELL-2,CELL-2);
    const playerMines=countAdjacentMines(px,py);
    ctx.fillStyle=defuseMode ? '#000' : '#fff';
    ctx.fillText(playerMines, psx+CELL/2, psy+CELL/2);
  }

  const currentMines = countAdjacentMines(px,py);
  coordEl.textContent = `x: ${px}, y: ${py}, mines: ${currentMines}, mode: ${defuseMode?'defuse':'walk'}`;
}
render();

function drawExplosion(){
  const VIEW_COLS = Math.floor(canvas.width / CELL);
  const VIEW_ROWS = Math.floor(canvas.height / CELL);
  const halfC = Math.floor(VIEW_COLS/2);
  const halfR = Math.floor(VIEW_ROWS/2);
  const cx = halfC*CELL + CELL/2;
  const cy = halfR*CELL + CELL/2;
  const r = CELL/2 - 2;
  ctx.fillStyle = '#f00';
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#ffa500';
  ctx.beginPath();
  for(let i=0;i<8;i++){
    const angle = i * Math.PI/4;
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(angle)*r, cy+Math.sin(angle)*r);
  }
  ctx.stroke();
}

const seedXInput = document.getElementById('seedX');
const seedYInput = document.getElementById('seedY');
seedXInput.value = seedX;
seedYInput.value = seedY;
function updateSeeds(){
  seedX = parseInt(seedXInput.value,10) || 0;
  seedY = parseInt(seedYInput.value,10) || 0;
  render();
}
seedXInput.addEventListener('input', updateSeeds);
seedYInput.addEventListener('input', updateSeeds);

// клавиатура
window.addEventListener('keydown', e=>{
  let handled = true;
  if (e.key==='ArrowUp' || e.key==='w') moveBy(0,-1);
  else if (e.key==='ArrowDown' || e.key==='s') moveBy(0,1);
  else if (e.key==='ArrowLeft' || e.key==='a') moveBy(-1,0);
  else if (e.key==='ArrowRight' || e.key==='d') moveBy(1,0);
  else if (e.key==='+' || e.key==='=') zoom(1.1);
  else if (e.key==='-') zoom(0.9);
  else if (e.key===' ') { defuseMode = !defuseMode; render(); }
  else handled = false;
  if (handled) e.preventDefault();
});

// D-pad
let holdTimer=null;
function startHold(dx,dy){
  moveBy(dx,dy);
  stopHold();
  holdTimer=setInterval(()=>moveBy(dx,dy),140);
}
function stopHold(){ if(holdTimer){clearInterval(holdTimer);holdTimer=null;} }
document.querySelectorAll('.btn').forEach(btn=>{
  const dx=parseInt(btn.dataset.dx,10), dy=parseInt(btn.dataset.dy,10);
  btn.addEventListener('touchstart', ev=>{ev.preventDefault();startHold(dx,dy);},{passive:false});
  btn.addEventListener('touchend', ev=>{ev.preventDefault();stopHold();},{passive:false});
  btn.addEventListener('mousedown', ()=>startHold(dx,dy));
  window.addEventListener('mouseup', stopHold);
});

// свайпы
let swipeStart=null;
let pinchStartDist=null, pinchStartCell=CELL;
canvas.addEventListener('touchstart', e=>{
  if(e.touches.length===1){
    swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY,t:performance.now()};
  }else if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchStartDist=Math.hypot(dx,dy);
    pinchStartCell=CELL;
    swipeStart=null;
    e.preventDefault();
  }
},{passive:false});
canvas.addEventListener('touchmove', e=>{
  if(e.touches.length===2 && pinchStartDist){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.hypot(dx,dy);
    setZoom(pinchStartCell*dist/pinchStartDist);
    e.preventDefault();
  }
},{passive:false});
canvas.addEventListener('touchend', e=>{
  if(e.touches.length<2) pinchStartDist=null;
  if(!swipeStart) return;
  const t=performance.now()-swipeStart.t;
  const touch=(e.changedTouches&&e.changedTouches[0])||null;
  if(touch){
    const dx=touch.clientX-swipeStart.x, dy=touch.clientY-swipeStart.y;
    const absX=Math.abs(dx), absY=Math.abs(dy);
    if(Math.max(absX,absY)>=24 && t<600){
      if(absX>absY) moveBy(dx>0?1:-1,0);
      else moveBy(0,dy>0?1:-1);
    }
  }
  swipeStart=null;
},{passive:true});

canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  zoom(e.deltaY<0?1.1:0.9);
},{passive:false});
</script>
</body>
</html>
