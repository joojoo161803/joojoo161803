<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Miner Game</title>
<style>
  html,body{margin:0;height:100%;background:#333;font-family:system-ui,Arial;color:#eee}
  #wrap{display:flex;flex-direction:column;height:100%}
  canvas{touch-action:none;display:block;margin:0 auto;background:#333;border:1px solid #999}
  #coords{text-align:center;margin-top:4px;font-size:14px}
  .controls{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:20px;
            padding:12px;pointer-events:none;}
  .pad{pointer-events:auto;display:grid;grid-template-columns:48px 48px 48px;
       grid-template-rows:48px 48px 48px;gap:6px;opacity:.95;user-select:none;}
  .btn{background:#fff;border:1px solid #bbb;border-radius:12px;
       box-shadow:0 2px 6px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;
       font-size:16px;font-weight:600;touch-action:none;}
  .btn:active{transform:translateY(1px)}
  .up{grid-column:2;grid-row:1}
  .left{grid-column:1;grid-row:2}
  .right{grid-column:3;grid-row:2}
  .down{grid-column:2;grid-row:3}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="640" height="480"></canvas>
  <div id="coords"></div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
